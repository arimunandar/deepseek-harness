# Keyless pi-ai composition: the base settings and credentials providers see
# only the isolated run home, the route names no `apiKeyEnv`, and no key exists
# anywhere — so pi-ai's own auth resolution refuses the route before the
# endpoint is dialed. This snapshot pins that refusal reaching the caller as
# MISSING_CREDENTIAL rather than the adapter's catch-all.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          # The endpoint is never dialed: the route has no credential to send.
          - id: llm-pi-ai-keyless
            name: '@deepseek-ai/dsh-llm-pi-ai'
            config:
              providers:
                deepseek:
                  baseURL: 'http://127.0.0.1:9'
                  models:
                    - id: deepseek-v4-flash
                      contextWindow: 128000
      # The pi-ai route key is its catalog provider id, so the agent is re-pinned
      # from the `deepseek-official` route the disabled adapter owned.
      - id: agent-spine
        name: '@deepseek-ai/dsh-agent-spine-demo'
        config:
          agents:
            - id: main
              provider: deepseek
              model: deepseek-v4-flash
              cwd: !!js process.cwd()
          workspaceContext:
            maxBytes: 65536
          persona: |
            You are headless-agent, a coding assistant powered by the {{model}} model.

            Verify your work by running the code or tests. Keep answers brief and
            factual.
