# Opt-in overlay that signs in to a pi-ai catalog provider at boot — by default
# Anthropic's "Claude Pro/Max" subscription flow.
# This file is a PATCH OVERLAY over a profile (its bundle layers), not a tree:
# `dsh --patch` applies it as one more sibling patch list at the same include
# level. A patch replaces the targeted row's whole `config`.

- insert:
    # The caller for one of the sign-in flows @deepseek-ai/dsh-llm-pi-ai registers
    # per installed catalog provider. The `authorization` seam those flows need
    # comes from the base bundle, so this overlay contributes only the caller.
    # A patch file contributes configuration but does not move the directory the
    # loader resolves module paths from, so this relative specifier resolves
    # against the booted profile's directory: copy anthropic-login.mjs into
    # $DSH_HOME/profiles/<profile>/ first.
    - id: anthropic-login
      name: './anthropic-login.mjs'
      config:
        # pi-ai catalog provider id, which is also the credential record id.
        provider: anthropic
        # 'oauth' is the subscription login; 'api-key' types a key instead.
        method: oauth
        # true re-runs the sign-in even when a credential is already stored.
        force: false
